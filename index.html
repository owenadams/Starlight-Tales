<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Starlight Tales AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b14;
      --card: #111a2e;
      --border: #223254;
      --primary: #818cf8;
      --accent: #f472b6;
      --text: #f8fafc;
      --body-text: #e2e8f0;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      background-image: 
        radial-gradient(ellipse at 15% 10%, rgba(99, 102, 241, 0.16) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 90%, rgba(244, 114, 182, 0.12) 0%, transparent 45%);
      color: var(--text);
      font-family: 'Lora', Georgia, serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
      transition: filter 0.4s ease;
    }
    .app-shell {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    header { text-align: center; padding: 6px 0 2px; }
    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.85rem;
      color: #e0e7ff;
      letter-spacing: 0.5px;
    }
    .badge-girls {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(244, 114, 182, 0.15);
      color: #f472b6;
      border: 1px solid rgba(244, 114, 182, 0.35);
      padding: 3px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      margin-top: 6px;
    }
    .toolbar { display: flex; justify-content: space-between; align-items: center; }
    .tool-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 5px 12px;
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .tool-btn.active {
      background: #312e81;
      color: #c7d2fe;
      border-color: #6366f1;
    }
    .main-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #apiBox {
      background: #17233f;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .input-field {
      background: #0d1424;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.85rem;
      outline: none;
      width: 100%;
    }
    .input-field:focus { border-color: var(--primary); }
    .menu-header-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.25rem;
      color: #fed7aa;
      margin-bottom: 2px;
    }
    .menu-sub {
      font-family: 'Quicksand', sans-serif;
      font-size: 0.85rem;
      color: var(--subtext);
      margin-bottom: 12px;
    }
    .preset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .preset-btn {
      background: #17233f;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 12px 10px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .preset-btn:active { border-color: var(--primary); background: #233152; }
    .custom-row { display: flex; gap: 8px; }
    .primary-btn {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
    }
    #readerScreen { display: none; flex-direction: column; gap: 16px; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .pills { display: flex; gap: 5px; }
    .step-pill {
      width: 24px;
      height: 6px;
      border-radius: 999px;
      background: #24355a;
      transition: background 0.3s;
    }
    .step-pill.active { background: var(--accent); }
    .photo-frame {
      width: 100%;
      height: 230px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
      background: #000;
    }
    .photo-art { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7, 11, 20, 0.05) 0%, rgba(17, 26, 46, 0.85) 100%);
      pointer-events: none;
    }
    .chapter-heading {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.35rem;
      color: #fef08a;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .story-text { font-size: 1.1rem; line-height: 1.8; color: var(--body-text); }
    .story-text p { margin-bottom: 14px; }
    .jessica-tag { color: #93c5fd; font-weight: 600; }
    .charlotte-tag { color: #f472b6; font-weight: 600; }
    .choices-shelf { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
    .choice-cta {
      background: #1b2848;
      border: 1.5px solid #2d4272;
      border-radius: 14px;
      padding: 16px;
      color: #ffffff;
      font-family: 'Quicksand', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .choice-cta:active { border-color: var(--accent); background: #253966; }
    .night-button {
      background: linear-gradient(135deg, #6366f1, #ec4899);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-family: 'Quicksand', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .loader-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 30px 10px;
      text-align: center;
    }
    .spin {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="app-shell">
    <header>
      <h1>✨ Starlight Tales AI</h1>
      <div class="badge-girls">Jessica (5) & Charlotte (2)</div>
    </header>

    <div class="toolbar">
      <button class="tool-btn" id="keyToggleBtn" onclick="toggleKeyBox()">⚙️ API Key</button>
      <button class="tool-btn" id="glowBtn" onclick="toggleSleepGlow()">🌙 Sleep Glow: Off</button>
    </div>

    <div id="apiBox">
      <p style="font-size: 0.8rem; color: var(--subtext); font-family: 'Quicksand', sans-serif;">
        Enter your Gemini API key:
      </p>
      <div style="display: flex; gap: 8px;">
        <input type="password" id="apiKeyInput" class="input-field" placeholder="AIzaSy..." />
        <button class="primary-btn" onclick="saveApiKey()">Save</button>
      </div>
      <span id="keyStatus" style="font-size: 0.75rem; color: #34d399; font-family: 'Quicksand', sans-serif;"></span>
    </div>

    <div class="main-card">
      <div id="setupScreen">
        <h2 class="menu-header-title">Create Tonight's Tale</h2>
        <p class="menu-sub">Tap a theme or type anything the girls want to hear:</p>

        <div class="preset-grid">
          <button class="preset-btn" onclick="setPrompt('The baby unicorn who lost her sparkly rainbow shoes')">
            <span style="font-size: 1.5rem;">🦄🌈</span>
            <span>Unicorn Shoes</span>
          </button>
          <button class="preset-btn" onclick="setPrompt('The baby cow who flew a cozy hay rocket to the moon sheep')">
            <span style="font-size: 1.5rem;">🚀🐮</span>
            <span>Moon Cow</span>
          </button>
          <button class="preset-btn" onclick="setPrompt('Barnaby Pig and the mystery of the missing golden apples')">
            <span style="font-size: 1.5rem;">🐷🔍</span>
            <span>Detective Pig</span>
          </button>
          <button class="preset-btn" onclick="setPrompt('Two princess sisters attending the midnight barnyard lullaby ball')">
            <span style="font-size: 1.5rem;">👑🐑</span>
            <span>Barnyard Ball</span>
          </button>
        </div>

        <div class="custom-row">
          <input type="text" id="customPrompt" class="input-field" placeholder="e.g. Friendly space ducks exploring a crystal pond" />
          <button class="primary-btn" id="generateBtn" onclick="generateNextChapter(1, '')">✨ Create</button>
        </div>
      </div>

      <div class="loader-box" id="loaderBox">
        <div class="spin"></div>
        <p style="font-size: 0.95rem; font-family: 'Quicksand', sans-serif; color: #fed7aa;" id="loaderText">
          Weaving bedtime magic for Jessica & Charlotte...
        </p>
      </div>

      <div id="readerScreen">
        <div class="top-bar">
          <span id="stepCounter">Chapter 1 of 3</span>
          <div class="pills">
            <div class="step-pill active" id="pill1"></div>
            <div class="step-pill" id="pill2"></div>
            <div class="step-pill" id="pill3"></div>
          </div>
        </div>

        <div class="photo-frame">
          <img id="sceneImage" class="photo-art" src="" alt="Story Scene" />
          <div class="photo-overlay"></div>
        </div>

        <div>
          <h3 class="chapter-heading" id="sceneTitle"></h3>
          <div class="story-text" id="sceneBody"></div>
        </div>

        <div class="choices-shelf" id="choicesBox"></div>
      </div>
    </div>
  </div>

  <script>
    const SCENE_PHOTOS = {
      unicorn: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80',
      space: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80',
      farm: 'https://images.unsplash.com/photo-1500595046743-cd271d694d30?auto=format&fit=crop&w=800&q=80',
      water: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80',
      bunny: 'https://images.unsplash.com/photo-1585110396000-c9ffd4e4b308?auto=format&fit=crop&w=800&q=80',
      sleep: 'https://images.unsplash.com/photo-1540518614846-7ede433c4ef0?auto=format&fit=crop&w=800&q=80',
      stars: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=800&q=80'
    };

    const MODEL_PREFERENCE = [
      'gemini-3.8-flash',
      'gemini-2.5-flash',
      'gemini-2.0-flash'
    ];

    window.onload = () => {
      const savedKey = localStorage.getItem('starlight_gemini_key');
      if (savedKey) {
        document.getElementById('apiKeyInput').value = savedKey;
        document.getElementById('keyStatus').innerText = '✓ Key loaded';
      } else {
        toggleKeyBox();
      }
    };

    function toggleKeyBox() {
      const box = document.getElementById('apiBox');
      box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
    }

    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      if (val) {
        localStorage.setItem('starlight_gemini_key', val);
        document.getElementById('keyStatus').innerText = '✓ Key saved successfully!';
        setTimeout(() => toggleKeyBox(), 1000);
      }
    }

    function setPrompt(text) {
      document.getElementById('customPrompt').value = text;
    }

    let currentStoryPrompt = '';
    let currentChapter = 1;
    let storyHistory = '';

    async function getAvailableModels(apiKey) {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000&key=${encodeURIComponent(apiKey)}`);
      const data = await res.json();
      if (!res.ok || data.error) {
        throw new Error(data.error?.message || `Could not list models (${res.status}).`);
      }

      const models = (data.models || [])
        .filter(model => model.supportedGenerationMethods?.includes('generateContent'))
        .map(model => model.baseModelId || model.name?.replace(/^models\//, ''))
        .filter(model => model?.startsWith('gemini-'));
      const availableModels = [...new Set(models)];
      const preferredModels = MODEL_PREFERENCE.filter(model => availableModels.includes(model));
      const remainingModels = availableModels
        .filter(model => !preferredModels.includes(model))
        .sort((firstModel, secondModel) => {
          const firstIsFlash = /flash/i.test(firstModel) ? 0 : 1;
          const secondIsFlash = /flash/i.test(secondModel) ? 0 : 1;
          return firstIsFlash - secondIsFlash || firstModel.localeCompare(secondModel);
        });

      return [...preferredModels, ...remainingModels].slice(0, 3);
    }

    async function callGeminiWithFallback(apiKey, systemPrompt) {
      const models = await getAvailableModels(apiKey);
      if (!models.length) {
        throw new Error('This API key has no Gemini models that support generateContent.');
      }

      const errors = [];
      for (const model of models) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: systemPrompt }] }],
              generationConfig: { responseMimeType: 'application/json' }
            })
          });

          const data = await res.json();
          if (!res.ok || data.error) {
            errors.push(`${model}: ${data.error?.message || `Request failed (${res.status}).`}`);
            continue;
          }

          const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (responseText) {
            return JSON.parse(responseText);
          }
          errors.push(`${model}: The API returned no generated text.`);
        } catch (err) {
          errors.push(`${model}: ${err.message}`);
        }
      }

      throw new Error(`All available Gemini models failed:\n${errors.join('\n')}`);
    }

    async function generateNextChapter(chapterNum, selectedChoice) {
      const apiKey = localStorage.getItem('starlight_gemini_key') || document.getElementById('apiKeyInput').value.trim();
      if (!apiKey) {
        alert('Please enter your Gemini API key in the ⚙️ API Key box.');
        toggleKeyBox();
        return;
      }

      if (chapterNum === 1) {
        currentStoryPrompt = document.getElementById('customPrompt').value.trim() || 'A magical adventure with baby animals and unicorns';
        storyHistory = '';
      }

      currentChapter = chapterNum;

      document.getElementById('setupScreen').style.display = 'none';
      document.getElementById('readerScreen').style.display = 'none';
      document.getElementById('loaderBox').style.display = 'flex';
      document.getElementById('loaderText').innerText = `Writing Chapter ${chapterNum} of 3 for Jessica & Charlotte...`;

      const systemPrompt = `
You are a master children's bedtime story author writing a soothing, coherent 3-chapter bedtime story.
Characters:
- Jessica: 5 years old, curious, caring, brave older sister who solves puzzles gently.
- Charlotte: 2 years old, giggly, toddler younger sister who points, makes animal noises ("Moo-moo!", "Baa baa!"), holds hands, and has short cute speech.

Themes: Farm animals, unicorns, princesses, space, talking animals, mysteries.
Tone: Warm, magical, comforting.
Current chapter: ${chapterNum} of 3.
Overall story premise: "${currentStoryPrompt}".
${selectedChoice ? `What happened just before: Reader picked: "${selectedChoice}".` : ''}
${storyHistory ? `Previous story events: ${storyHistory}` : ''}

Rules:
- Write 3 to 4 rich, well-paced paragraphs (~180-220 words total for this chapter).
- Highlight Jessica's caring sisterly nature and Charlotte's genuine 2-year-old reactions.
- If chapterNum is 1 or 2: Provide 2 simple, engaging next choices for the sisters to pick.
- If chapterNum is 3: Wrap up the story completely with a quiet, cozy bedroom tuck-in, ending with Charlotte and Jessica whispering goodnight and falling peacefully asleep. Return an empty array []
- Choose one "photoKeyword" from: "unicorn", "space", "farm", "water", "bunny", "stars", "sleep".

Return pure JSON matching this schema:
{
  "title": "Chapter title",
  "paragraphs": ["paragraph 1", "paragraph 2", "paragraph 3", "paragraph 4"],
  "photoKeyword": "unicorn",
  "choices": ["Choice A", "Choice B"]
}
`;

      try {
        const chapterData = await callGeminiWithFallback(apiKey, systemPrompt);
        storyHistory += ` Chapter ${chapterNum}: ` + chapterData.paragraphs.join(' ');
        displayChapter(chapterData);
      } catch (err) {
        alert('Error: ' + err.message);
        document.getElementById('loaderBox').style.display = 'none';
        document.getElementById('setupScreen').style.display = 'block';
      }
    }

    function displayChapter(data) {
      document.getElementById('loaderBox').style.display = 'none';
      document.getElementById('readerScreen').style.display = 'flex';

      document.getElementById('stepCounter').innerText = `Chapter ${currentChapter} of 3`;
      document.getElementById('sceneTitle').innerText = data.title;

      document.getElementById('pill1').className = currentChapter >= 1 ? 'step-pill active' : 'step-pill';
      document.getElementById('pill2').className = currentChapter >= 2 ? 'step-pill active' : 'step-pill';
      document.getElementById('pill3').className = currentChapter >= 3 ? 'step-pill active' : 'step-pill';

      const photoUrl = SCENE_PHOTOS[data.photoKeyword] || (currentChapter === 3 ? SCENE_PHOTOS.sleep : SCENE_PHOTOS.farm);
      document.getElementById('sceneImage').src = photoUrl;

      const bodyBox = document.getElementById('sceneBody');
      bodyBox.innerHTML = data.paragraphs.map(p => {
        let formatted = p.replace(/Jessica/g, '<span class="jessica-tag">Jessica</span>');
        formatted = formatted.replace(/Charlotte/g, '<span class="charlotte-tag">Charlotte</span>');
        return `<p>${formatted}</p>`;
      }).join('');

      const choicesBox = document.getElementById('choicesBox');
      choicesBox.innerHTML = '';

      if (data.choices && data.choices.length > 0) {
        data.choices.forEach(choiceText => {
          const btn = document.createElement('button');
          btn.className = 'choice-cta';
          btn.innerHTML = `<span>👉</span> <span>${choiceText}</span>`;
          btn.onclick = () => generateNextChapter(currentChapter + 1, choiceText);
          choicesBox.appendChild(btn);
        });
      } else {
        const finishBtn = document.createElement('button');
        finishBtn.className = 'night-button';
        finishBtn.innerHTML = '🌙 Goodnight Jessica & Charlotte (Read Another)';
        finishBtn.onclick = () => {
          document.getElementById('readerScreen').style.display = 'none';
          document.getElementById('setupScreen').style.display = 'block';
          document.getElementById('customPrompt').value = '';
        };
        choicesBox.appendChild(finishBtn);
      }
    }

    function toggleSleepGlow() {
      const btn = document.getElementById('glowBtn');
      if (document.body.style.filter) {
        document.body.style.filter = '';
        btn.classList.remove('active');
        btn.innerText = '🌙 Sleep Glow: Off';
      } else {
        document.body.style.filter = 'sepia(0.35) brightness(0.9)';
        btn.classList.add('active');
        btn.innerText = '✨ Sleep Glow: On';
      }
    }
  </script>
</body>
</html>
